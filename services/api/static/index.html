<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .answer-container {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .answer-container h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .answer-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .error-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff3f3;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .error-text {
            color: #c0392b;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Ask AI</h1>
        <p class="subtitle">Задайте вопрос, и я постараюсь на него ответить</p>

        <form id="questionForm">
            <div class="form-group">
                <label for="question">Ваш вопрос:</label>
                <textarea id="question" name="question" placeholder="Введите ваш вопрос здесь..." required></textarea>
            </div>
            <button type="submit">Отправить</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Обрабатываю ваш запрос...</p>
        </div>

        <div class="answer-container" id="answerContainer" style="display: none;">
            <h3>Ответ:</h3>
            <p class="answer-text" id="answerText"></p>
        </div>

        <div class="error-container" id="errorContainer" style="display: none;">
            <p class="error-text" id="errorText"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('questionForm');
        const loading = document.getElementById('loading');
        const answerContainer = document.getElementById('answerContainer');
        const answerText = document.getElementById('answerText');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const question = document.getElementById('question').value.trim();
            if (!question) return;

            // Reset UI
            answerContainer.style.display = 'none';
            errorContainer.style.display = 'none';
            loading.classList.add('active');

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (response.ok) {
                    answerText.textContent = data.answer;
                    answerContainer.style.display = 'block';
                } else {
                    throw new Error(data.detail || 'Произошла ошибка');
                }
            } catch (error) {
                errorText.textContent = error.message;
                errorContainer.style.display = 'block';
            } finally {
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
